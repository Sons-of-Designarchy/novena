home:
  hero:
    subtitle: we embrace your music
  about:
    body: >-
      Independent Grammy and Latin Grammy winning studio with locations in
      Mexico City and Santiago de Chile. Novena has become a home for Latin
      American and international musicians. Welcoming everyone from emerging
      artists to global names drawn by a warm, collaborative atmosphere where
      the artistic vision is meticulously crafted.
  pillars:
    - Creation
    - Community
    - Quality
  pillarsBody:
    - >-
      We are people who make things. That comes first. Before the gear, before
      the room. Unhurried, curious, and always on your side of the idea.
    - >-
      The people who record here come back, and they bring others. Not a client
      list. A circle that got bigger one session at a time.
    - >-
      We'd rather get the take than fix it. Analog path, monitors you can
      trust, and the time it actually takes to get it right.
  marquee:
    studio: Estudio Novena
    city: Mexico City
    recording: Recording
    independent: Independent
    sessions: Sessions

team:
  title: Team
  bios:
    ben: >-
      Italo-Thai. Combines work in music with managing the studio, and
      education as a professor at SAE México.
    felipe: >-
      Chilean producer, engineer, guitarist. Won the Latin Grammys hanging on
      the wall, then went straight back to creating. Co-founder of Estudio
      Novena in 2022.
    ale: >-
      Mexican producer, engineer, songwriter and bassist. Making sure the song
      is its best and the sound is on point. Always groovy.
    tom: >-
      Minnesotan producer, engineer, guitarist. Cares deeply about sound,
      experimentation, and community.
    fabio: >-
      Italo-British resident artist known as Noize London. Writes and records
      italo-disco in Studio C.
    dan: >-
      Mexican drum tech, drummer and artist. Plays the grooves and keeps the
      vibes on point. Always paint on his nails and a smile on his face.
    rayito: >-
      Mexican. Greets every visitor (quietly), contributing nothing to the mix
      and everything to the mood.

