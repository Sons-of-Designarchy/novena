home:
  hero:
    subtitle: abrazamos tu música
  about:
    body: >-
      Es un estudio ganador del Grammy y Latin Grammy ubicado en la colonia
      Narvarte de la Ciudad de México. Se ha convertido en un hogar para
      músicos latinoamericanos e internacionales — recibiendo desde artistas
      emergentes hasta figuras globales — todos atraídos por un ambiente
      acogedor y colaborativo donde la visión artística siempre encuentra su
      lugar.
  pillars:
    - Creación
    - Comunidad
    - Calidad
  pillarsBody:
    - >-
      Somos gente que crea cosas. Eso va primero. Antes del equipo, antes de la
      sala. Sin prisa, con curiosidad y siempre del lado de tu idea.
    - >-
      Quienes graban aquí vuelven, y traen a otros. No es una lista de
      clientes. Es un círculo que creció sesión por sesión.
    - >-
      Preferimos lograr la toma que arreglarla. Cadena analógica, monitores en
      los que puedes confiar y el tiempo que de verdad toma hacerlo bien.
  marquee:
    studio: Estudio Novena
    city: Ciudad de México
    recording: Grabación
    independent: Independiente
    sessions: Sesiones

team:
  eyebrow: Con quién trabajamos
  title: Equipo
  bios:
    ben: >-
      Ítalo-tailandés. Dirige el estudio y las sesiones. Combina la gestión con
      la producción, la composición y la docencia como profesor en SAE México.
    felipe: >-
      Productor, ingeniero y guitarrista chileno. Ganó los Latin Grammys que
      están colgados en la pared del Estudio A, y volvió enseguida a crear.
    ale: >-
      Productor, ingeniero jefe y bajista mexicano. El que sabe dónde va cada
      cable y por qué la sala suena así.
    tom: >-
      Productor, ingeniero y guitarrista de Minnesota. Muy experimental y
      carpintero de la casa, construye los paneles y los paisajes sonoros desde
      el Estudio B.
    fabio: >-
      Artista ítalo-británico conocido como Noize London. Escribe y graba aquí,
      saca temazos de italo-disco y siempre anda con algún talento local en el
      Estudio C.
    dan: >-
      Técnico de baterías y baterista mexicano. Afina los kits, toca los grooves
      y mantiene la buena vibra. Siempre con pintura encima y una sonrisa.
    rayito: >-
      Mexicano. Recibe a cada visita, asiste a cada sesión, no aporta nada a la
      mezcla y todo al ambiente.

