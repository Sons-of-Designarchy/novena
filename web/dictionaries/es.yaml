home:
  hero:
    subtitle: abrazamos tu música
  about:
    body: >-
      Es un estudio ganador del Grammy y Latin Grammy ubicado en la colonia
      Narvarte de la Ciudad de México. Se ha convertido en un hogar para
      músicos latinoamericanos e internacionales — recibiendo desde artistas
      emergentes hasta figuras globales — todos atraídos por un ambiente
      acogedor y colaborativo donde la visión artística siempre encuentra su
      lugar.
  pillars:
    - Creación
    - Comunidad
    - Calidad
